# Weekly update PRs for the SHA-pinned actions and the locked Python
# packages. The cooldown skips releases younger than a week, so a compromised
# release has time to be caught upstream first. Security updates are not
# delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
