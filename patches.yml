# Source for the Patches page (hooks/patches.py). State, counts and the date
# come live from the PR wall's feed at build time; this file only says how to
# group repos and which PRs to feature, with their short titles.
#
# A PR that is not listed under `picks` still counts toward its project. A repo
# that no project claims gets its own group, so new work shows up untouched.

source: https://prs.wayne.is-a.dev/api/contributions.json

projects:
  - name: FlashInfer
    url: https://github.com/flashinfer-ai/flashinfer
    logo: /assets/logos/flashinfer.png
    repos: { flashinfer-ai/flashinfer: null }
  - name: vLLM
    url: https://github.com/vllm-project/vllm
    logo: /assets/logos/vllm.png
    repos: { vllm-project/vllm: null, vllm-project/compressed-tensors: compressed-tensors, vllm-project/llm-compressor: llm-compressor }
  - name: LMDeploy
    url: https://github.com/InternLM/lmdeploy
    logo: /assets/logos/internlm.png
    repos: { InternLM/lmdeploy: null }
  - name: Dynamo
    url: https://github.com/ai-dynamo/dynamo
    logo: /assets/logos/dynamo.png
    repos: { ai-dynamo/dynamo: null }
  - name: PyTorch
    url: https://github.com/pytorch/pytorch
    logo: /assets/logos/pytorch.png
    repos: { pytorch/pytorch: null, pytorch/ao: torchao }
  - name: NVIDIA
    url: https://github.com/NVIDIA
    logo: /assets/logos/nvidia.png
    repos: { NVIDIA/cutlass: CUTLASS, NVIDIA/TensorRT-LLM: TensorRT-LLM, triton-inference-server/server: Triton }
  - name: SGLang
    url: https://github.com/sgl-project/sglang
    logo: /assets/logos/sglang.png
    repos: { sgl-project/sglang: null }

# PRs that landed outside GitHub's merge button (PyTorch lands through ghstack,
# so GitHub shows them closed and the feed leaves them out). They count as
# merged. The value is a note appended to the bullet.
landed:
  https://github.com/pytorch/pytorch/pull/187216: landed in `main` as `c3c33fd`

