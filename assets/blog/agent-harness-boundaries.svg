  <text x="60" y="586" fill="#667384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">SOURCE-LEVEL COMPARISON · PRIME 1fc1adb · HERMES afe06f2 · OPENCLAW v2026.8.1</text>
