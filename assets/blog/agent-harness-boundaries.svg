<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent harness control surfaces</title>
  <desc id="desc">A technical diagram comparing Prime, Hermes, and OpenClaw by where control, state, and trust live.</desc>
